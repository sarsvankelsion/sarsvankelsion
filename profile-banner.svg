            <svg class="ic" viewBox="0 0 24 24"><path fill="#fff" d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56v-2.18c-3.2.7-3.87-1.37-3.87-1.37-.52-1.33-1.28-1.68-1.28-1.68-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.72-1.54-2.55-.29-5.23-1.28-5.23-5.68 0-1.25.45-2.28 1.19-3.08-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11.1 11.1 0 0 1 5.78 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.8 1.19 1.83 1.19 3.08 0 4.41-2.69 5.38-5.25 5.67.41.35.77 1.05.77 2.12v3.15c0 .31.21.67.8.55A10.51 10.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/></svg>
            <svg class="ic" viewBox="0 0 24 24"><path fill="#fff" d="M12 3.9c-4.13 0-7.5 3.29-7.5 8.1 0 1.98.67 3.8 1.8 5.28l-1.8 1.72a2.4 2.4 0 0 0 .25 3.22 2.4 2.4 0 0 0 3.22-.25L10.5 20.5c.5.07 1 .1 1.5.1 4.13 0 7.5-3.29 7.5-8.1S16.13 3.9 12 3.9zm0 10.8a2.7 2.7 0 1 1 0-5.4 2.7 2.7 0 0 1 0 5.4z" transform="translate(-1 -1)"/></svg>
            <svg class="ic" viewBox="0 0 24 24"><path fill="#fff" d="M22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6zm-2 0l-8 4.99L4 6h16zm0 12H4V8l8 5 8-5v10z"/></svg>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>