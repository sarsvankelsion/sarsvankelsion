<svg fill="none" viewBox="0 0 1200 500" width="1200" height="500" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .banner {
          width: 1200px; height: 500px;
          background: #030303;
          background-image:
            linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
          background-size: 50px 50px;
          font-family: 'JetBrains Mono', Consolas, 'Courier New', monospace;
          color: #e2e8f0;
          display: flex; align-items: flex-end;
          padding: 50px;
          position: relative;
          overflow: hidden;
        }
        .corner { display: flex; flex-direction: column; align-items: flex-start; }
        .avatar-wrapper { position: relative; width: 90px; height: 90px; margin-bottom: 25px; }
        .avatar {
          width: 100%; height: 100%; border-radius: 50%;
          object-fit: cover; border: 2px solid #aaaaaa;
          filter: grayscale(100%);
          animation: avatarGlow 4s ease-in-out infinite;
        }
        .avatar-ring {
          position: absolute; inset: -8px;
          border: 1px dashed #aaaaaa; border-radius: 50%;
          animation: spin 10s linear infinite;
        }
        .glitch {
          position: relative; color: #ffffff;
          font-size: 90px; font-weight: 800;
          letter-spacing: 2px; line-height: 1;
          margin-bottom: 12px;
          font-family: Impact, 'Arial Black', Arial, sans-serif;
          text-transform: uppercase;
        }
        .glitch::before, .glitch::after {
          content: attr(data-text);
          position: absolute; top: 0; left: 0;
          width: 100%; height: 100%; opacity: 0.8; z-index: -1;
        }
        .glitch::before { left: 2px; text-shadow: -2px 0 #555; animation: g1 2s infinite linear alternate-reverse; }
        .glitch::after  { left: -2px; text-shadow: 2px 0 #fff; animation: g2 3s infinite linear alternate-reverse; }
        .typewriter { font-size: 22px; color: #aaaaaa; margin-bottom: 20px; }
        .typewriter b { color: #ffffff; }
        .cursor { color: #ffffff; animation: blink 1s step-end infinite; font-weight: bold; }
        .row { display: flex; gap: 18px; align-items: center; }
        .ic { width: 30px; height: 30px; opacity: 0.6; animation: iconPulse 3s ease-in-out infinite; }
        .ic:hover { opacity: 1; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
        @keyframes avatarGlow {
          0%, 100% { box-shadow: 0 0 10px rgba(255,255,255,0.1); }
          50% { box-shadow: 0 0 30px rgba(255,255,255,0.5); }
        }
        @keyframes iconPulse {
          0%, 100% { opacity: 0.4; transform: scale(1); }
          50% { opacity: 1; transform: scale(1.15); }
        }
        @keyframes g1 {
          0% { clip-path: inset(20% 0 80% 0); }
          20% { clip-path: inset(60% 0 10% 0); }
          40% { clip-path: inset(40% 0 50% 0); }
          60% { clip-path: inset(80% 0 5% 0); }
          80% { clip-path: inset(10% 0 70% 0); }
          100% { clip-path: inset(30% 0 50% 0); }
        }
        @keyframes g2 {
          0% { clip-path: inset(10% 0 60% 0); }
          20% { clip-path: inset(30% 0 20% 0); }
          40% { clip-path: inset(70% 0 10% 0); }
          60% { clip-path: inset(20% 0 50% 0); }
          80% { clip-path: inset(50% 0 30% 0); }
          100% { clip-path: inset(5% 0 80% 0); }
        }
      </style>
      <div class="banner">
        <div class="corner">
          <div class="avatar-wrapper">
            <div class="avatar-ring"></div>
            <img class="avatar" src="data:image/jpeg;base64," alt="" />
          </div>
          <div class="glitch" data-text="sarsRS">sarsRS</div>
          <div class="typewriter">I'm <b>a Developer</b><span class="cursor">_</span></div>
          <div class="row">
