<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <style>
      .mono { font-family: Consolas, 'Courier New', monospace; }
      .title { font-family: Impact, 'Arial Black', Arial, sans-serif; text-transform: uppercase; }
      .ring { animation: spin 8s linear infinite; transform-origin: 90px 90px; }
      .ring2 { animation: spin 12s linear infinite reverse; transform-origin: 90px 90px; }
      .pulse { animation: pulse 3s ease-in-out infinite; }
      .blink { animation: blink 1s step-end infinite; }
      .glow { animation: glow 4s ease-in-out infinite; }
      @keyframes spin { 100% { transform: rotate(360deg); } }
      @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
      @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
      @keyframes glow { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.9; } }
      @keyframes wave { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      .wave { animation: wave 2s ease-in-out infinite; }
      .glitch-anim { animation: glitch1 2s infinite linear alternate-reverse; }
      .glitch-anim2 { animation: glitch2 3s infinite linear alternate-reverse; }
      @keyframes glitch1 {
        0% { clip-path: inset(20% 0 80% 0); } 20% { clip-path: inset(60% 0 10% 0); }
        40% { clip-path: inset(40% 0 50% 0); } 60% { clip-path: inset(80% 0 5% 0); }
        80% { clip-path: inset(10% 0 70% 0); } 100% { clip-path: inset(30% 0 50% 0); }
      }
      @keyframes glitch2 {
        0% { clip-path: inset(10% 0 60% 0); } 20% { clip-path: inset(30% 0 20% 0); }
        40% { clip-path: inset(70% 0 10% 0); } 60% { clip-path: inset(20% 0 50% 0); }
        80% { clip-path: inset(50% 0 30% 0); } 100% { clip-path: inset(5% 0 80% 0); }
      }
    </style>
  </defs>

  <rect width="1200" height="500" fill="#030303"/>
  <rect width="1200" height="500" fill="url(#grid)"/>

  <g transform="translate(40,140)">
    <circle class="ring" cx="90" cy="90" r="52" fill="none" stroke="#4a4a4a" stroke-dasharray="5 5" stroke-width="1.5"/>
    <circle class="ring2" cx="90" cy="90" r="60" fill="none" stroke="#2a2a2a" stroke-dasharray="2 6" stroke-width="1"/>
    <circle cx="90" cy="90" r="45" fill="#0f0f14" stroke="#aaa" stroke-width="2"/>
    <text class="title" x="90" y="107" font-size="52" fill="#ffffff" text-anchor="middle">S</text>
    <circle cx="90" cy="90" r="45" fill="none" stroke="#e2e8f0" stroke-width="1" opacity="0.15" class="glow"/>
  </g>

  <g transform="translate(170,155)">
    <text class="title glitch-anim" x="2" y="0" font-size="88" font-weight="800" fill="#4a4a4a" letter-spacing="3">sarsRS</text>
    <text class="title glitch-anim2" x="-2" y="0" font-size="88" font-weight="800" fill="#e2e8f0" letter-spacing="3">sarsRS</text>
    <text class="title" x="0" y="0" font-size="88" font-weight="800" fill="#ffffff" letter-spacing="3">sarsRS</text>
  </g>

  <g transform="translate(170,225)" class="mono">
    <text x="0" y="0" font-size="24" fill="#8b93a3">I'm <tspan fill="#ffffff" font-weight="bold">a Developer</tspan><tspan class="blink" fill="#ffffff">_</tspan></text>
  </g>

  <g transform="translate(170,270)" class="mono">
    <text x="0" y="0" font-size="16" fill="#555d6e">Go | Python | TypeScript | C++ | Lua | Next.js</text>
  </g>

  <g transform="translate(170,320)" class="pulse">
    <text class="mono" x="0" y="0" font-size="15" fill="#e2e8f0" opacity="0.7">// code, coffee, repeat</text>
  </g>

  <g transform="translate(40,400)" class="mono">
    <rect x="0" y="-12" width="118" height="28" rx="6" fill="none" stroke="#3a3a3a" stroke-width="1.2"/>
    <text x="59" y="5" font-size="14" fill="#e2e8f0" text-anchor="middle" letter-spacing="2">BIO</text>
  </g>
  <g transform="translate(175,400)" class="mono">
    <rect x="0" y="-12" width="150" height="28" rx="6" fill="none" stroke="#3a3a3a" stroke-width="1.2"/>
    <text x="75" y="5" font-size="14" fill="#e2e8f0" text-anchor="middle" letter-spacing="2">ACHIEVEMENTS</text>
  </g>
  <g transform="translate(342,400)" class="mono">
    <rect x="0" y="-12" width="108" height="28" rx="6" fill="none" stroke="#3a3a3a" stroke-width="1.2"/>
    <text x="54" y="5" font-size="14" fill="#e2e8f0" text-anchor="middle" letter-spacing="2">PROJECTS</text>
  </g>

  <g transform="translate(40,455)" class="mono">
    <text x="0" y="0" font-size="13" fill="#4a5263">sarsvankelsion</text>
  </g>
  <g transform="translate(200,455)" class="mono">
    <text class="pulse" x="0" y="0" font-size="13" fill="#8b93a3">●</text>
    <text x="18" y="0" font-size="13" fill="#4a5263">open to work</text>
  </g>

  <text class="mono wave" x="1155" y="460" font-size="22" fill="#e2e8f0" text-anchor="end">▲</text>
</svg>